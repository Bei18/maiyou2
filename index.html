<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>麦友 - 下载</title>

  <link
    rel="icon"
    href="./app-icon-512.png"
    type="image/png"
  >
  <link
    rel="apple-touch-icon"
    href="./app-icon-512.png"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="card">
    <div class="app-icon-wrapper">
      <img
        id="appIcon"
        src="./app-icon-512.png"
        alt="麦友"
        class="app-icon"
      >
    </div>

    <h1 class="app-name" id="appName">
      麦友
    </h1>

    <p class="app-desc" id="appDesc">
      免费使用的聊天软件
    </p>

    <a
      id="downloadBtn"
      class="btn-download"
      href="javascript:void(0);"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
      <span>下载应用</span>
    </a>

    <div class="info-section">
      <p class="info-item">Android 应用安装包</p>
      <p class="info-item">下载后请按照系统提示完成安装</p>
      <p class="version" id="appVersion">v1.1.5</p>
    </div>
  </main>

  <!-- 微信内打开遮罩 -->
  <div class="wechat-overlay" id="wechatOverlay">
    <div class="wechat-content">
      <div class="wechat-top">
        <div class="wechat-arrow">
          <svg viewBox="0 0 70 70">
            <path d="M8 60 C25 42, 40 25, 59 10" />
            <path d="M42 10 L59 10 L59 27" />
          </svg>
        </div>
      </div>

      <h2 class="wechat-title">请在浏览器内打开</h2>

      <p class="wechat-subtitle">
        当前页面在微信内打开。<br>
        请按照下方提示在系统浏览器中打开并继续。
      </p>

      <div class="wechat-card">
        <div class="wechat-step">
          <div class="wechat-number">1</div>
          <div class="wechat-step-text">
            点击页面右上角的 <strong>「•••」</strong> 菜单
          </div>
        </div>

        <div class="wechat-step">
          <div class="wechat-number">2</div>
          <div class="wechat-step-text">
            选择 <strong>「在浏览器打开」</strong>
          </div>
        </div>

        <div class="wechat-step">
          <div class="wechat-number">3</div>
          <div class="wechat-step-text">
            页面重新打开后，点击下载按钮即可
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
